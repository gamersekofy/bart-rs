name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features --locked

      # The crate is published, and most consumers will want the library
      # without the command line tool. These are the combinations the
      # library guide tells people to use, so they have to keep building.
      #
      # The first one is the one that catches a missing `required-features`
      # on the binary: with the default features off, `src/main.rs` reaches
      # for `bart_rs::cli`, which does not exist.
      - name: Build without the default features
        run: cargo build --no-default-features --locked

      - name: Build the library with the download feature
        run: cargo build --no-default-features --features download --locked

      - name: Build the command line tool
        run: cargo build --no-default-features --features cli --locked

      - name: Test
        run: cargo test --all-features --locked

      - name: Check the documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version declared as `rust-version` in Cargo.toml. If a dependency
      # raises its floor, this job fails and the manifest has to be updated
      # rather than quietly going stale.
      - name: Install the minimum supported Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Build with the minimum supported Rust
        run: cargo build --all-features --locked

      - name: Test with the minimum supported Rust
        run: cargo test --all-features --locked

  deny:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checks the dependency tree for known security advisories, licence
      # compatibility, duplicate versions and unexpected sources. A new
      # advisory breaks the build instead of sitting unnoticed in the
      # lockfile.
      - uses: EmbarkStudios/cargo-deny-action@v2

  package:
    name: publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Builds the crate exactly as it would be published, and then builds
      # and tests it again from the packaged tarball, which is the only way
      # to be sure the package is self-contained.
      #
      # The second step is not run with `--offline`. `cargo package` only
      # builds the library and the binary, so it never downloads the
      # development dependencies -- but the lockfile it puts in the tarball
      # does list them, and they are needed to run the tests. On a runner
      # with a cold cache that combination fails with "attempting to make an
      # HTTP request, but --offline was specified". `--locked` is what
      # matters here: it proves the tarball ships a lockfile that resolves
      # without being changed.
      - name: Check the package
        run: cargo package --locked

      - name: Test the packaged crate
        run: |
          tar -xzf target/package/*.crate -C target/package
          cd target/package/bart-rs-*/
          cargo test --all-features --locked

  nix:
    name: nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Check the flake
        run: nix flake check --no-build

      # `--no-build` evaluates the flake's checks without building them, so
      # the binary itself is built here. The flake's test check is not run:
      # it is the same test suite the `test` job already runs.
      - name: Build the binary with Nix
        run: nix build

      - name: Build the dev shell
        run: nix develop --command cargo --version
