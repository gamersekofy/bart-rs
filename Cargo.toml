[package]
name = "bart-rs"
version = "0.1.0"
edition = "2024"
# The minimum Rust this crate supports.
#
# This is not the floor of edition 2024, which is 1.85. It is 1.88 because
# the dependency tree needs it: `time`, `time-core` and `zopfli` require
# 1.88.0, and the `icu_*` crates behind `url` -> `idna` -> `icu_normalizer`
# require 1.88. Declaring anything lower would promise a toolchain that
# cannot actually build the lockfile, and would leave `cargo` picking
# dependency versions that fail to compile.
rust-version = "1.88"
description = "Command line tool and library for exploring BART's GTFS schedule and realtime data"
license = "MIT"
repository = "https://github.com/gamersekofy/bart-rs"
homepage = "https://github.com/gamersekofy/bart-rs"
documentation = "https://docs.rs/bart-rs"
readme = "README.md"
keywords = ["gtfs", "bart", "transit", "realtime", "cli"]
categories = ["command-line-utilities", "parsing"]

# Edition 2024 already implies resolver 3, which is stated here so that the
# reason is written down: resolver 3 honours `rust-version` when choosing
# dependency versions. Resolver 2 does not, which is how a tree needing
# Rust 1.88 ends up in a crate claiming 1.85.
resolver = "3"

# What goes into the published crate.
#
# The source, the tests and the fixtures all ship, so that `cargo test`
# works on the published crate and the design record travels with it. What
# does not ship is the development scaffolding: the flake, the toolchain
# file, the direnv hook and the CI workflows are all about working on the
# project, not about using it.
exclude = [
    ".github/",
    ".envrc",
    ".gitignore",
    "flake.lock",
    "flake.nix",
    "rust-toolchain.toml",
]

[features]
default = ["cli", "download"]
# The `cli` feature is the binary front end. A library consumer that only
# wants to parse a feed does not pull in clap.
#
# It implies `download`, because the command line tool is the whole tool:
# `update` fetches the feed and the realtime commands fetch the live
# feeds, so a `cli` without the network stack would be missing commands
# rather than having a lighter version of them.
cli = ["dep:clap", "dep:colored", "download"]
# The `download` feature is the network + archive stack, used by `update` and
# by the realtime fetchers.
download = ["dep:reqwest", "dep:zip"]

# The binary is the command line tool, and `src/main.rs` reaches for
# `bart_rs::cli`, which only exists with the `cli` feature. Without
# `required-features`, cargo builds the binary anyway and the build fails
# for anyone who turns the default features off.
[[bin]]
name = "bart-rs"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
dirs = "5"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

clap = { version = "4", features = ["derive"], optional = true }
colored = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "gzip",
], optional = true }
zip = { version = "9", optional = true }

[dev-dependencies]
# Used only as a cross-validation oracle in the test suite: the live-feed
# integration test asserts that our hand-rolled parser agrees with a
# well-known reference implementation. Never used by the library itself.
#
# `default-features = false` is important: the default `read-url` feature
# pulls in `reqwest` -> `native-tls` -> `openssl-sys`, which would make the
# whole project depend on OpenSSL headers for no benefit.
gtfs-structures = { version = "0.50", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
